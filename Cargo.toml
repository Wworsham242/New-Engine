[workspace]
resolver = "3"
members = [
    "crates/sim-types",
    "crates/sim-storage",
    "crates/sim-units",
    "crates/sim-equations",
    "crates/sim-contracts",
    "crates/sim-state",
    "crates/sim-kernel",
    "crates/sim-random",
    "crates/sim-tools",
    "crates/subsystem-demographics",
    "crates/subsystem-energy",
    "crates/subsystem-economy",
    "crates/subsystem-governance",
